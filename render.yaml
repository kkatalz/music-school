# Render Blueprint for the NestJS API.
# The database lives on Supabase and the React app on Vercel, so this file only
# describes the one service Render owns.
services:
  - type: web
    name: music-school-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npm run build
    # Migrations run from the compiled dist/ so the prod image needs no ts-node.
    startCommand: npm run migration:run:prod && npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: '20'
      # Supabase session-pooler connection string. Set in the dashboard, never
      # committed. Render injects PORT itself.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated origins allowed to call the API cross-origin. The Vercel
      # rewrite makes requests same-origin, so this is only a fallback for
      # hitting the API host directly.
      - key: CORS_ORIGINS
        sync: false
